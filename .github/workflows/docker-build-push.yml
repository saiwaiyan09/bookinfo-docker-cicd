name: Bookinfo Docker CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    name: ${{ matrix.service }}-${{ matrix.version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 3

      matrix:
        service:
          - productpage
          - details
          - ratings
          - reviews

        version:
          - original
          - updated
          - optimized

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set Dockerfile name
        shell: bash
        run: |
          if [ "${{ matrix.version }}" = "original" ]; then
            echo "DOCKERFILE=Dockerfile" >> "$GITHUB_ENV"
          else
            echo "DOCKERFILE=Dockerfile.${{ matrix.version }}" >> "$GITHUB_ENV"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: saiwaiyan09
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/${{ env.DOCKERFILE }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: saiwaiyan09/bookinfo-${{ matrix.service }}:${{ matrix.version }}
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.version }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.version }}

      - name: Write build summary
        if: success()
        run: |
          echo "### Docker Image Build" >> "$GITHUB_STEP_SUMMARY"
          echo "- Service: ${{ matrix.service }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: ${{ matrix.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Platform: linux/amd64" >> "$GITHUB_STEP_SUMMARY"
          echo "- Published: ${{ github.event_name != 'pull_request' }}" >> "$GITHUB_STEP_SUMMARY"
